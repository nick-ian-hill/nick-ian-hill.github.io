<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
    <!-- Background / Canvas -->
    <rect width="800" height="400" fill="none" />
    
    <!-- Definitions for arrows and filters -->
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
        </marker>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Phase 1: Ingestion & Linearization -->
    <g transform="translate(40, 50)">
        <rect width="160" height="300" rx="12" fill="rgba(15, 23, 42, 0.5)" stroke="#1e293b" stroke-width="2" />
        <text x="80" y="30" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">INGESTION</text>
        
        <!-- Document Icon -->
        <rect x="50" y="60" width="60" height="80" rx="4" fill="#334155" />
        <path d="M50 75 h60 M50 90 h60 M50 105 h40" stroke="#1e293b" stroke-width="2" />
        <text x="80" y="160" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="600">Source .docx</text>
        
        <!-- Virtual Linearization -->
        <circle cx="80" cy="230" r="30" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="2" style="filter: url(#glow);" />
        <text x="80" y="275" text-anchor="middle" fill="#ec4899" font-family="Inter, sans-serif" font-size="10" font-weight="600">OOXML ENGINE</text>
        <text x="80" y="288" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="9">Virtual Linearization</text>
    </g>

    <!-- Transition Arrow -->
    <line x1="200" y1="200" x2="250" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

    <!-- Phase 2: Agentic Loop (Surgical) -->
    <g transform="translate(270, 50)">
        <rect width="220" height="180" rx="12" fill="rgba(56, 189, 248, 0.05)" stroke="#38bdf8" stroke-width="2" />
        <text x="110" y="25" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">SURGICAL EDITING</text>
        
        <!-- Agents -->
        <g transform="translate(20, 50)">
            <rect width="180" height="40" rx="6" fill="#0f172a" stroke="#1e293b" />
            <text x="90" y="25" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11">Workhorse (Flash)</text>
        </g>
        <g transform="translate(20, 100)">
            <rect width="180" height="40" rx="6" fill="#0f172a" stroke="#1e293b" />
            <text x="90" y="25" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11">Critic (Pro)</text>
        </g>
        
        <!-- Persistent State -->
        <rect x="40" y="155" width="140" height="15" rx="3" fill="#1e293b" />
        <text x="110" y="166" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="9">.aline_analysis.json</text>
    </g>

    <!-- Phase 3: Synthesis Loop (Story Analysis) -->
    <g transform="translate(270, 250)">
        <rect width="220" height="100" rx="12" fill="rgba(192, 132, 252, 0.05)" stroke="#a855f7" stroke-width="2" />
        <text x="110" y="25" text-anchor="middle" fill="#a855f7" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">GLOBAL SYNTHESIS</text>
        
        <g transform="translate(20, 45)">
            <rect width="180" height="40" rx="6" fill="#0f172a" stroke="#1e293b" />
            <text x="90" y="25" text-anchor="middle" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11">Director (Pro)</text>
        </g>
    </g>

    <!-- Transition Arrow to Final -->
    <line x1="490" y1="200" x2="540" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />

    <!-- Output -->
    <g transform="translate(560, 50)">
        <rect width="200" height="300" rx="12" fill="rgba(15, 23, 42, 0.5)" stroke="#1e293b" stroke-width="2" />
        <text x="100" y="30" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="0.05em">OUTPUT</text>
        
        <!-- Track Changes Doc -->
        <rect x="40" y="60" width="120" height="40" rx="4" fill="#0f172a" stroke="#4ade80" stroke-dasharray="4" />
        <text x="100" y="85" text-anchor="middle" fill="#4ade80" font-family="Inter, sans-serif" font-size="11">Edited Manuscript</text>
        
        <!-- Analysis Report -->
        <rect x="40" y="110" width="120" height="40" rx="4" fill="#0f172a" stroke="#38bdf8" />
        <text x="100" y="135" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11">Story Analysis</text>

        <!-- Master Narrative State -->
        <rect x="40" y="160" width="120" height="120" rx="6" fill="#1e293b" fill-opacity="0.5" />
        <text x="100" y="180" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="9" font-weight="600">MASTER STATE</text>
        <text x="50" y="200" fill="#64748b" font-family="Courier New, monospace" font-size="8">{ "bible": [...], </text>
        <text x="50" y="215" fill="#64748b" font-family="Courier New, monospace" font-size="8">  "timeline": [...], </text>
        <text x="50" y="230" fill="#64748b" font-family="Courier New, monospace" font-size="8">  "ledger": "..." }</text>
    </g>
</svg>
